name: Daily Trending Tech Digest

# Runs automatically every day at 06:00 UTC, unattended.
# Also runnable manually via "workflow_dispatch" for testing.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write  # needed so the agent can commit the digest back to the repo

jobs:
  run-digest-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the digest agent
        working-directory: ./src
        run: python agent.py

      - name: Commit and push the new digest
        run: |
          git config user.name "trending-digest-agent"
          git config user.email "actions@github.com"
          git add logs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated digest: $(date -u +%Y-%m-%d)"
          git push
